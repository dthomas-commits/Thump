<style>
:root{color-scheme:dark;--bg:#3b0a5c;--t1:#ffd3f2;--t2:#ff5ccf;--t3:#b02fff}

.home .row2{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,transparent),rgba(255,255,255,.05))}

<div id="wrap">
<canvas id="g" width="960" height="540"></canvas>
<canvas id="bgc"></canvas>
<div id="ui"><div id="menu"><h1>THUMP</h1><p class="tag">THUMB RHYTHM</p>
<div class="card home"><button class="big" id="bs">START</button><button class="big alt" id="bcr">CREATE</button>
<div class="set"><label>Gesture sensitivity<input id="sens" type="range" min="25" max="70" value="50"></label>
<label>Music volume<input id="vol" type="range" min="0" max="100" value="70"></label>
<label>Note timing <span id="ov">0 ms</span><input id="off" type="range" min="-250" max="250" value="0"></label>
<label>Background color<input id="bgcol" type="color" value="#3b0a5c"></label></div>
<div class="btns" style="margin:0"><button class="mini" id="bhow">HOW TO PLAY</button><button class="mini" id="offr">RESET TIMING</button><button class="mini" id="bfs">FULLSCREEN</button></div></div>
<p class="hint" id="hint">Click anywhere to start the music</p><p class="sub">Point your thumb left, up, down or right. Tuck it in to pause. Arrow keys also work. Build 19</p></div>
<div id="songs" class="card" style="display:none"></div><div id="create" class="card" style="display:none"></div><div id="end" class="card home" style="display:none"></div></div>
<div id="toast"></div><div id="how"></div><canvas id="tcam" width="320" height="240"></canvas><div id="st">Ready</div>
</div>
<script src="/vendor/hands.js"></script>
<script>
const cv=document.getElementById('g'),cx=cv.getContext('2d'),W=960,H=540,VX=480,VY=96,HIT=452;
const cam=document.createElement('canvas');cam.width=320;cam.height=240;const cc=cam.getContext('2d');
const vid=document.createElement('video');vid.playsInline=true;vid.muted=true;
const st=document.getElementById('st'),ui=document.getElementById('ui'),sens=document.getElementById('sens'),vol=document.getElementById('vol');
const LN=[{k:'left',a:180,c:'#58d6ff',n:'G',f:392},{k:'up',a:90,c:'#a98bff',n:'A',f:440},{k:'down',a:-90,c:'#ffb347',n:'B',f:493.9},{k:'right',a:0,c:'#ff6fae',n:'D',f:587.3}];
const RING=[1,3,2,0]; // up, right, down, left: neighbours are 90 degrees apart
const DIFF={easy:{n:'Easy',c:'#4ade80',step:2,on:0,gap:.5,keep:1,sil:.5,far:0,win:.3,fail:0},mod:{n:'Moderate',c:'#facc15',step:1,on:3,gap:.45,keep:.5,sil:.4,far:0,win:.32,fail:1},hard:{n:'Difficult',c:'#f87171',step:1,on:2.2,gap:.4,keep:.75,sil:.5,far:.1,win:.28,fail:1},god:{n:'Thump God',c:'#c084fc',step:.25,on:1,gap:.09,keep:1,sil:.5,far:.6,win:.16,fail:1}};
const SONGS=[['sky-high','Sky High','Elektronomia','easy',128],['fade','Fade','Alan Walker','easy',90],['the-spectre','The Spectre','Alan Walker','mod',128],['fluffing-a-duck','Fluffing a Duck','Kevin MacLeod','mod',120],['cradles','Cradles','Sub Urban','hard',140],['nekozilla','Nekozilla','Different Heaven','hard',150],['montagem-india','MONTAGEM INDIA','GXL','god',130]].map(a=>({id:a[0],t:a[1],a:a[2],d:a[3],bpm:a[4]}));
const FALL=2.2,NB=56,C1='#7ee8f5',DIM='#2a5666',MONO='ui-monospace,Menlo,Consolas,monospace';
let ac,T0,cf=DIFF.easy,song=null,dur=0,bpmD=0,mg,sg,rg,dst,srcN,scr='menu',tucked=false,rec=false,recd=[],probed=0,cp=null,tc=0,lastHK=null,lastHT=-9,camLive=false,recPaused=false,recPrev=null,pray=0,god=false,have={},notes=[],run=false,score=0,combo=0,bestC=0,stats={perfect:0,good:0,miss:0},shield=5,fuel=0,parts=[],pops=[],
 gest=null,keyG=null,eff=null,cur=null,sx=0,sy=0,hasHand=false,lastG=null,lastGT=0,minLen=.45,hands=null,camOK=false,tried=false,bests={};
try{bests=JSON.parse(localStorage.getItem('tb-best'))||{}}catch(e){}
function rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
const rnd=rng(5),bub=Array.from({length:70},()=>({x:rnd()*W,y:rnd()*H,r:5+rnd()*rnd()*45,v:.08+rnd()*.25}));
const LX=i=>VX+(i-1.5)*125;
function pos(l,t){const x2=LX(l),q=VX+(x2-VX)*.1,u=1-t;return[u*u*VX+2*u*t*q+t*t*x2,u*u*VY+2*u*t*270+t*t*HIT]}
const adf=(a,b)=>Math.abs(((a-b+540)%360)-180);

/* ---------- chart + music ---------- */
function analyse(b){const d=b.getChannelData(0),sr=b.sampleRate,hop=Math.round(sr*.0116),n=Math.floor(d.length/hop)-1,e=new Float32Array(n),o=new Float32Array(n);
 for(let i=0;i<n;i++){let a=0,c=0;for(let j=1;j<hop;j+=2){const v=d[i*hop+j],w=v-d[i*hop+j-1];a+=v*v;c+=w*w}e[i]=Math.sqrt(a*2/hop)+1.5*Math.sqrt(c*2/hop)}
 for(let i=1;i<n;i++)o[i]=Math.max(0,e[i]-e[i-1]);
 const dt=hop/sr,lo=Math.round(60/180/dt),hi=Math.round(60/70/dt),R={};
 for(let l=lo-1;l<=hi+1;l++){let s=0;for(let i=l;i<n;i++)s+=o[i]*o[i-l];R[l]=s}
 let bl=lo;for(let l=lo;l<=hi;l++)if(R[l]>R[bl])bl=l;
 const q=R[bl-1]-2*R[bl]+R[bl+1],pf=bl+(q?Math.max(-1,Math.min(1,.5*(R[bl-1]-R[bl+1])/q)):0);
 let bp=0,bv=-1;for(let f=0;f<bl;f++){let s=0;for(let k=0;f+k*pf<n;k++)s+=o[Math.round(f+k*pf)];if(s>bv){bv=s;bp=f}}
 let per=pf*dt,ph=bp*dt;const mo=o.reduce((a,b)=>a+b,0)/n;
 for(let it=0;it<6;it++){let K=0,S=0,T=0,KK=0,KT=0; // fit beat line to real onsets so it cannot drift
  for(let k=0;ph+k*per<b.duration-.5;k++){const c=Math.round((ph+k*per)/dt);let bi=-1,bo=0;for(let i=c-3;i<=c+3;i++)if(i>0&&i<n&&o[i]>bo){bo=o[i];bi=i}
   if(bi>0&&bo>mo*2){const t=bi*dt;K++;S+=k;T+=t;KK+=k*k;KT+=k*t}}
  if(K>8&&K*KK-S*S>0){per=(K*KT-S*T)/(K*KK-S*S);ph=(T-per*S)/K}}
 return{e,o,dt,per,ph,dur:b.duration}}
function chart(an,df){const{e,o,dt,per,ph,dur}=an,n=e.length,mean=e.reduce((a,b)=>a+b,0)/n||1,r=rng(11),c=[];
 const at=(a,i)=>a[Math.max(0,Math.min(n-1,i))],loud=t=>{const i=Math.round(t/dt);let s=0;for(let j=-4;j<=4;j++)s+=at(e,i+j);return s/9};
 let t=ph;while(t<2)t+=per;
 for(;t<dur-1;t+=per*df.step)if(loud(t)>=df.sil*mean&&r()<df.keep)c.push(t);
 if(df.on)for(let i=2;i<n-2;i++){let m=0;for(let j=-40;j<=40;j+=2)m+=at(o,i+j);m/=41;
  if(o[i]>o[i-1]&&o[i]>=o[i+1]&&o[i]>df.on*m*1.2&&o[i]>.02*mean&&i*dt>2&&i*dt<dur-1&&loud(i*dt)>=df.sil*mean*.8)c.push(i*dt)}
 c.sort((a,b)=>a-b);const a=[];let last=-9,p=0;
 for(const t of c){const s=r()<df.far?2:(r()<.5?1:3);if(t-last<df.gap*(s===2?1.5:1))continue;last=t;p=(p+s)%4;a.push({t,l:RING[p],d:0})}
 return a}
function tone(t,f,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(dst);o.start(t);o.stop(t+d+.02)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(dst);o.start(t);o.stop(t+.22)}
function hat(t,nb){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f).connect(g).connect(dst);s.start(t)}
function music(B){const nb=ac.createBuffer(1,2205,44100),dd=nb.getChannelData(0);for(let i=0;i<2205;i++)dd[i]=Math.random()*2-1;
 const bass=[98,82.41,65.41,73.42],pad=[[392,493.9],[329.6,392],[392,523.3],[293.7,370]],mel=[392,440,493.9,587.3];
 dst=rg;for(let i=0;i<dur/B;i++){const t=T0+i*B,bar=Math.floor(i/4)%4;
  kick(t);hat(t+B/2,nb);tone(t,bass[bar],B*.9,'sawtooth',.07);
  if(i%4===0)pad[bar].forEach(f=>tone(t,f,B*3.8,'triangle',.03));
  if(i%2)tone(t+B/2,mel[(i*7)%4]/2,.3,'triangle',.03)}dst=sg}

/* ---------- thumb tracking ---------- */
